</head>
<body>
    <script>
        let numero01 = Number(prompt("Digite um numero"))
        let numero02 = Number(prompt("Digite outro numero"))
        

        if(numero01 > numero02){
            alert(`${numero01} maior que ${numero02}`)
        }else if (numero02 > numero01){
            alert(`${numero02} maior que ${numero01}`)
        }else {
            alert("Numeros iguais")
        }
    </script>
</body>
</html>
