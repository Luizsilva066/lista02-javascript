<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 18</title>
</head>

<body>
    <script>
        let nome = prompt("Digite o nome do aluno:");
        let turno = prompt("Digite o turno (M para Matutino, V para Vespertino):");

        if (turno.toUpperCase() === "M") {
            alert("Bom dia, aluno " + nome + "!");
        } else if (turno.toUpperCase() === "V") {
            alert("Boa tarde, aluno " + nome + "!");
        } else {
            alert("Turno inválido!");
        }
    </script>
</body>

</html>
