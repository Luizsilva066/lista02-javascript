<head>

    <title>ex 02</title>
</head>
<body>
    <script>
        let nome1 = prompt("Digite seu nome")
        let idade1 = parseInt(prompt("Digite sua idade: "))
        let nome2 = prompt("Digite outro nome: ")
        let idade2 = parseInt(prompt("Digite sua idade"))

        if (idade1 > idade2) {
            alert (`${nome1} É mais velho que ${nome2}`)
        } else {
            alert (`${nome2} É mais velho que ${nome1}`)
        }

    </script>
