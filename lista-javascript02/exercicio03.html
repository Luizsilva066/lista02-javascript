<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        let numero1 = Number(prompt("Digite um Numero"))
        
        if (numero1 >0) {
            alert("Numero positivo")
        }else if (numero1 <0){
            alert("Numero negativo")
        }else {
            alert("Numero zero")
        }
    </script>
</body>
</html>
