    <script>
        let nota1 = parseInt(prompt("Digite a nota do seu primeiro Bimestre"))
        let nota2 = parseInt(prompt("Digite a nota do seu Segundo Bimestre"))
        let nota3 = parseInt(prompt("Digite a nota do seu Terceiro Bimestre"))

        let resultado = (nota1 * nota2 * nota3 ) / 3

        if ( resultado >=7){
            alert("Aprovado")
        }else {
            alert("Reprovado")
        }
        </script>
