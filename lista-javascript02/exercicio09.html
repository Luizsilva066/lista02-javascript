<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 09</title>
</head>
<body>
    <script>

        let mes = prompt("Digite o nome de um mês").toLowerCase();

        switch (mes) {
            case "janeiro":
            case "março":
            case "maio":
            case "julho":
            case "agosto":
            case "outubro":
            case "dezembro":
                alert("Esse mês tem 31 dias.");
                break;
            case "abril":
            case "junho":
            case "setembro":
            case "novembro":
                alert("Esse mês tem 30 dias")
                break;
            case "fevereiro":
                alert("Esse mês tem 28 a 29 dias")
                break;
                default:
                    alert("Mês invalido. Por favor digite novamente:")
        }
        </script>
</body>
</html>
