<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 19</title>
</head>

<body>
    <script>
        let idade = Number(prompt("Digite a idade:"));

        if (idade < 16) {
            alert("Não pode votar.");
        } else if ((idade >= 16 && idade < 18) || idade > 70) {
            alert("Voto facultativo.");
        } else {
            alert("Voto obrigatório.");
        }
    </script>
</body>

</html>
