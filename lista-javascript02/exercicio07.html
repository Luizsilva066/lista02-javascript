<body>
    <script>
        let numero01 = Number(prompt("Digite um numero para saber se ele é par ou impar"))
        
        if (numero01 % 2 == 0) {
            alert ("Numero par")
        }else {
            alert ("Numero impar")
        }
    </script>
</body>
